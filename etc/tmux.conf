# remote-agent-stack tmux settings.
#
# The named Copilot CLI agents run as full-screen TUIs that manage their own
# mouse tracking and scrollback, and your terminal/Termius tabs already label
# each session by name — so tmux's own status bar is redundant chrome. Hide it
# by default to reclaim the bottom row.
#
# Toggle it back on for the CURRENT session with:  prefix + b
set -g status off
bind b set status
