# remote-agent-stack tmux settings.
#
# The named agent sessions run as full-screen TUIs (Copilot CLI, Claude Code
# CLI) that manage their own mouse tracking and scrollback, and your
# terminal/Termius tabs already label each session by name — so tmux's own
# status bar is redundant chrome. Hide it by default to reclaim the bottom row.
#
# Toggle it back on for the CURRENT session with:  prefix + b
set -g status off
bind b set status

# Advertise 24-bit truecolor (RGB) to the apps running inside tmux. Without
# this, tmux caps at 256 colors and can't emit RGB-background sequences, so a
# TUI's themed panel background falls back to plain black instead of matching
# your terminal/Termius theme. The outer terminal must itself support truecolor
# (Termius, iTerm2, Apple Terminal, kitty, … all do). Takes effect on the next
# client attach — detach and reattach the session to pick it up.
set -as terminal-features ",xterm-256color:RGB,tmux-256color:RGB"

# The line above lets tmux PASS truecolor out to the terminal; this makes apps
# EMIT it in the first place. Node/Ink TUIs (Copilot CLI, Claude Code CLI) pick
# their color depth from $COLORTERM + $TERM, and tmux-256color alone reads as
# 256-color, so they never paint a truecolor background. Exporting
# COLORTERM=truecolor into panes fixes that. Only affects processes started
# after it's set; tmux still down-converts to 256 for any terminal that
# genuinely can't do truecolor.
set-environment -g COLORTERM truecolor
